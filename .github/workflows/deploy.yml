name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The data workflow commits with GITHUB_TOKEN, and GitHub never starts another workflow
  # from such a push, so its commits sat in main without reaching the site (it stayed on
  # the last human push). workflow_run is exempt from that rule: deploy after it finishes.
  workflow_run:
    workflows: ['Refresh data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен только последний.
# Уже начатый не отменяем, чтобы не оставить публикацию на полпути.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      # Данные лежат в репозитории готовыми — их пересобирает
      # отдельный еженедельный workflow, а не сборка сайта.
      - name: Build
        run: npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
